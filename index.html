<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>محمد حسيكو | سفر ومغامرات</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Tahoma, sans-serif;
            background: linear-gradient(135deg, #0b1220, #18243a);
            color: white;
            display: flex;
            justify-content: center;
            padding: 35px 18px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        .profile {
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
            border-radius: 50%;
            border: 4px solid white;
            background: linear-gradient(135deg, #334155, #0f172a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
        }

        h1 {
            margin: 10px 0;
            font-size: 36px;
        }

        .english {
            font-size: 22px;
            color: #cbd5e1;
            margin-bottom: 25px;
        }

        .bio {
            font-size: 19px;
            line-height: 2;
            color: #e2e8f0;
            margin-bottom: 30px;
        }

        .link {
            display: block;
            text-decoration: none;
            color: white;
            padding: 20px;
            margin: 16px 0;
            border-radius: 18px;
            font-size: 21px;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.18);
            transition: 0.25s;
        }

        .link:hover {
            transform: translateY(-3px);
            opacity: 0.9;
        }

        .youtube {
            background: #dc2626;
        }

        .instagram {
            background: linear-gradient(45deg, #7c3aed, #db2777, #f59e0b);
        }

        .tiktok {
            background: #111827;
        }

        .footer {
            margin-top: 40px;
            color: #94a3b8;
            font-size: 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="profile">
            👤
        </div>

        <h1>محمد حسيكو</h1>

        <div class="english">
            Mohammad Hasiko
        </div>

        <div class="bio">
            🌍 صانع محتوى في السفر والمغامرات<br>
            🎥 استكشاف أماكن جديدة وتجارب مختلفة<br>
            👇 تابعني على منصات التواصل
        </div>

        <a class="link youtube"
           href="https://www.youtube.com/@MohammedHseiko"
           target="_blank"
           rel="noopener noreferrer">
            ▶️ قناتي على YouTube
        </a>

        <a class="link instagram"
           href="https://www.instagram.com/mohamedhasiko/"
           target="_blank"
           rel="noopener noreferrer">
            📸 Instagram
        </a>

        <a class="link tiktok"
           href="https://www.tiktok.com/@mohammedhasiko"
           target="_blank"
           rel="noopener noreferrer">
            🎵 TikTok
        </a>

        <div class="footer">
            © 2026 Mohammad Hasiko
        </div>

    </div>

</body>
</html>
