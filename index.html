<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mohammad Hasiko | محمد حسيكو</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #1e293b, #0f172a);
      color: white;
      display: flex;
      justify-content: center;
      padding: 35px 15px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    .profile {
      margin-bottom: 25px;
    }

    .profile img {
      width: 125px;
      height: 125px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid white;
      box-shadow: 0 8px 30px rgba(0,0,0,.4);
    }

    h1 {
      margin-top: 15px;
      font-size: 28px;
    }

    .username {
      margin-top: 6px;
      color: #cbd5e1;
      font-size: 16px;
    }

    .bio {
      margin: 18px 10px 25px;
      color: #e2e8f0;
      line-height: 1.8;
      font-size: 15px;
    }

    .link {
      display: block;
      width: 100%;
      margin: 14px 0;
      padding: 17px 20px;
      border-radius: 16px;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.15);
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      transition: .25s;
      backdrop-filter: blur(10px);
    }

    .link:hover {
      transform: scale(1.03);
      background: rgba(255,255,255,.18);
    }

    .youtube {
      background: rgba(255,0,0,.25);
    }

    .instagram {
      background: rgba(225,48,108,.25);
    }

    .tiktok {
      background: rgba(0,0,0,.35);
    }

    .footer {
      margin-top: 30px;
      color: #94a3b8;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="profile">

      <!-- اسم صورة البروفايل -->
      <img src="mohammad-hasiko.png" alt="Mohammad Hasiko">

      <h1>محمد حسيكو</h1>

      <div class="username">
        Mohammad Hasiko
      </div>

      <div class="bio">
        🌍 صانع محتوى في السفر والمغامرات<br>
        🎥 استكشاف أماكن جديدة وتجارب مختلفة<br>
        تابعني على منصات التواصل 👇
      </div>

    </div>

    <!-- يوتيوب -->
    <a class="link youtube"
       href="#"
       target="_blank">
      ▶️ قناتي على YouTube
    </a>

    <!-- إنستغرام -->
    <a class="link instagram"
       href="#"
       target="_blank">
      📸 Instagram
    </a>

    <!-- تيك توك -->
    <a class="link tiktok"
       href="#"
       target="_blank">
      🎵 TikTok
    </a>

    <div class="footer">
      © 2026 Mohammad Hasiko
    </div>

  </div>

</body>
</html>
